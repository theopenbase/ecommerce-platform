name: CI

on:
  push:
    branches: [main, develop, 'release/*', 'feature/*']
  pull_request:
    branches: [main, develop]

env:
  GOPRIVATE: github.com/ecommerce
  GONOSUMDB: '*'
  GOPROXY: https://goproxy.cn,direct

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - goods-service
          - order-service
          - payment-service
          - marketing-service
          - shop-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build service
        working-directory: ./${{ matrix.service }}
        run: |
          go build ./...

      - name: Run unit tests
        working-directory: ./${{ matrix.service }}
        run: |
          go test -v -short ./...

      - name: Run integration tests
        working-directory: ./${{ matrix.service }}/tests
        run: |
          go test -v ./...
        continue-on-error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - goods-service
          - order-service
          - payment-service
          - marketing-service
          - shop-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Update ArgoCD
        run: |
          argocd app set ${{ env.ARGOCD_APP_PREFIX }}-${{ matrix.service }} \
            --kustomize-image ghcr.io/${{ github.repository }}/${{ matrix.service }}=${{ github.sha }}
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_STAGING_TOKEN }}
          ARGOCD_APP_PREFIX: ecommerce
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
