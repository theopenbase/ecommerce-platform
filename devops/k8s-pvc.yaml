# ============================================================
# Kubernetes — PVC (PersistentVolumeClaim)
# 用于需要持久化存储的组件：MySQL, Redis, MinIO 等
# 生产环境建议使用云厂商 CSI (AWS EBS / CSI / Azure Disk)
# ============================================================

---
# MySQL 数据持久化
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data-pvc
  namespace: ecommerce
  labels:
    app: mysql
    tier: database
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.mysql.size | default "50Gi" }}

---
# Redis 数据持久化
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: ecommerce
  labels:
    app: redis
    tier: cache
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.redis.size | default "10Gi" }}

---
# MinIO / 对象存储本地缓存
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data-pvc
  namespace: ecommerce
  labels:
    app: minio
    tier: storage
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.minio.size | default "100Gi" }}

---
# Elasticsearch 数据卷
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-pvc
  namespace: ecommerce
  labels:
    app: elasticsearch
    tier: search
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.elasticsearch.size | default "200Gi" }}
